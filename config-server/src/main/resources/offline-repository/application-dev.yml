---
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      path: /h2
      enabled: true
  datasource:
    url: jdbc:h2:mem:test
    username: sa
    password:
    driver-class-name: org.h2.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9098/auth-server/.well-known/jwks.json

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

feign:
  accessTokenUri: http://localhost:9098/auth-server/oauth/token
  clientId: clientId
  clientSecret: secret
